name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential ffmpeg pkg-config libsdl2-dev libsdl2-ttf-dev libsdl2-image-2.0-0 fonts-dejavu-core libavcodec-dev libavutil-dev libswresample-dev
      - name: Validate release metadata and documentation
        run: python3 tools/validate-metadata.py
      - name: Run sanitizer-backed host tests
        run: tools/test.sh
      - name: Reproduce B7 storage rejection across execution UIDs
        run: |
          c++ -std=c++11 -g -Wall -Wextra -fsanitize=address,undefined -Isrc tests/b7_storage_layout_test.cpp -o build/tests/b7-storage-layout-test
          sudo build/tests/b7-storage-layout-test
