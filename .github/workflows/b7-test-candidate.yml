name: Temporary TEST-only B7 Starfish candidate (148bc961)

on:
  push:
    branches: [fix/pr10-b7-compatibility]
    paths: [.github/workflows/b7-test-candidate.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 148bc9616f3edfff3d63ec6181f081322d1017fd
          persist-credentials: false
      - name: Verify exact source and supported build host
        run: |
          test "$(git rev-parse HEAD)" = 148bc9616f3edfff3d63ec6181f081322d1017fd
          test -z "$(git status --porcelain)"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
      - name: Install verified-process build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake ninja-build pkg-config perl curl git python3 file xz-utils bzip2
          npm install --global @webos-tools/cli@3.2.6
          ares -V
      - name: Build and verify exact Starfish source for webOS 3-4
        run: |
          python3 tools/validate-metadata.py
          tools/build.sh --media=starfish
          python3 tools/verify-elf.py build/app | tee dist/ELF_REPORT.txt
          python3 tools/validate-ipk.py
          grep -qx 'commit=148bc9616f3edfff3d63ec6181f081322d1017fd' build/app/build-info.txt
      - name: Label one unchanged IPK as a TEST-only candidate
        run: |
          cp dist/com.github.depius.uxair_1.1.0_arm-webos3-4.ipk dist/UxAir-1.1.0-TEST-B7-148bc961-arm-webos3-4.ipk
          git rev-parse HEAD > dist/BUILD_COMMIT.txt
          printf '%s\n' 'TEST ONLY: physical LG OLED B7 / webOS 3.9 validation.' 'Source commit: 148bc9616f3edfff3d63ec6181f081322d1017fd' 'Identity retained: com.github.depius.uxair / 1.1.0; no development feature flags enabled.' 'Security-release hold remains active. Not a safety assessment or GitHub Release.' 'Do not bypass browser security warnings.' > dist/TEST-CANDIDATE.txt
          printf 'Packaging workflow commit: %s\n' "$GITHUB_SHA" >> dist/TEST-CANDIDATE.txt
          (cd dist && sha256sum UxAir-1.1.0-TEST-B7-148bc961-arm-webos3-4.ipk > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
          cat dist/BUILD_COMMIT.txt dist/SHA256SUMS dist/TEST-CANDIDATE.txt
      - name: Upload temporary authenticated TEST artifact (one day)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TEST-UxAir-B7-148bc961-${{ github.run_id }}
          path: |
            dist/UxAir-1.1.0-TEST-B7-148bc961-arm-webos3-4.ipk
            dist/ELF_REPORT.txt
            dist/BUILD_COMMIT.txt
            dist/SHA256SUMS
            dist/TEST-CANDIDATE.txt
          if-no-files-found: error
          retention-days: 1
