name: Build UxAir 1.1.0 B7 Starfish ARMv7 package

on:
  push:
    branches:
      - main
      - fix/pr10-b7-compatibility
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential ffmpeg pkg-config libsdl2-dev libsdl2-ttf-dev libsdl2-image-2.0-0 fonts-dejavu-core libavcodec-dev libavutil-dev libswresample-dev
      - name: Validate source and run sanitizer-backed tests
        run: |
          python3 tools/validate-metadata.py
          tools/test.sh
      - name: Validate B7 storage compatibility across execution UIDs
        run: |
          c++ -std=c++11 -g -Wall -Wextra -fsanitize=address,undefined -Isrc tests/b7_storage_layout_test.cpp src/settings.cpp src/usage_stats.cpp -o build/tests/b7-storage-layout-test
          sudo build/tests/b7-storage-layout-test
      - name: Upload host SDL History previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: history-render-previews-${{ github.sha }}
          path: build/tests/history-*.bmp
          if-no-files-found: error
          retention-days: 14
  build-ipk:
    needs: native-tests
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Apple Silicon host
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          xcode-select -p
          python3 --version
          node --version
      - name: Install build and packaging tools
        run: |
          brew install cmake ninja pkgconf
          npm install --global @webos-tools/cli@3.2.6
          cmake --version
          ninja --version
          pkg-config --version
          ares -V
          command -v ares-package
      - name: Validate source metadata
        run: python3 tools/validate-metadata.py
      # Branch-local B7 validation: build only production Starfish for webOS 3-4.
      - name: Build and verify the webOS 3-4 (Starfish) IPK
        run: |
          tools/build.sh --media=starfish
          python3 tools/verify-elf.py build/app | tee dist/ELF_REPORT-webos3-4.txt
          python3 tools/validate-ipk.py
      - name: Build corresponding source archive
        run: tools/source-package.py
      - name: Preserve Starfish ELF report
        run: cp dist/ELF_REPORT-webos3-4.txt dist/ELF_REPORT.txt
      - name: Record source commit and package checksum
        run: |
          git rev-parse HEAD > dist/BUILD_COMMIT.txt
          (cd dist && shasum -a 256 *.ipk *-source.tar.gz > SHA256SUMS)
          (cd dist && shasum -a 256 -c SHA256SUMS)
          cat dist/BUILD_COMMIT.txt dist/SHA256SUMS dist/ELF_REPORT.txt
      - name: Upload verified UxAir 1.1.0 production package and source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uxair-1.1.0-production-armv7-${{ github.sha }}
          path: |
            dist/*.ipk
            dist/*-source.tar.gz
            dist/SHA256SUMS
            dist/BUILD_COMMIT.txt
            dist/ELF_REPORT.txt
          if-no-files-found: error
          retention-days: 14
