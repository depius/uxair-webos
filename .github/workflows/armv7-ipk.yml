name: Build UxAir 1.2.0 ARMv7 package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential ffmpeg pkg-config libplist-dev libsdl2-dev libsdl2-ttf-dev fonts-dejavu-core libavcodec-dev libavutil-dev libswresample-dev
      - name: Validate source and run sanitizer-backed tests
        run: |
          python3 tools/validate-metadata.py
          tools/test.sh
      - name: Upload host SDL History previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: history-render-previews-${{ github.sha }}
          path: build/tests/history-*.bmp
          if-no-files-found: error
          retention-days: 14
  build-ipk:
    needs: native-tests
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Apple Silicon host
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          xcode-select -p
          python3 --version
          node --version
      - name: Install build and packaging tools
        run: |
          brew install cmake ninja pkgconf
          npm install --global @webos-tools/cli@3.2.6
          cmake --version
          ninja --version
          pkg-config --version
          ares -V
          command -v ares-package
      - name: Validate source metadata
        run: python3 tools/validate-metadata.py
      - name: Build UxAir 1.2.0 development IPK
        run: tools/build.sh --development
      - name: Build corresponding source archive
        run: python3 tools/source-package.py --development
      - name: Verify staged ELF and package
        run: |
          python3 tools/verify-elf.py build/app | tee dist/ELF_REPORT.txt
          python3 tools/validate-ipk.py --development
      - name: Record source commit and package checksum
        run: |
          git rev-parse HEAD > dist/BUILD_COMMIT.txt
          (cd dist && shasum -a 256 *.ipk *-source.tar.gz > SHA256SUMS)
          cat dist/BUILD_COMMIT.txt dist/SHA256SUMS dist/ELF_REPORT.txt
      - name: Upload verified UxAir 1.2.0 development package and source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uxair-1.2.0-development-armv7-${{ github.sha }}
          path: |
            dist/*.ipk
            dist/*-source.tar.gz
            dist/SHA256SUMS
            dist/BUILD_COMMIT.txt
            dist/ELF_REPORT.txt
          if-no-files-found: error
          retention-days: 14
